name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        working-directory: repos/what-ever-mail

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: repos/what-ever-mail/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native addons for Electron
        run: npm run rebuild

      - name: Bundle release notes for Windows
        run: node scripts/bundle-release-notes.mjs win

      - name: Build and package for Windows
        run: npm run build && electron-builder --win --x64 && npm run release-notes:cleanup

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatever-mail-windows-installer
          path: repos/what-ever-mail/dist/*.exe
          if-no-files-found: error

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatever-mail-windows-zip
          path: repos/what-ever-mail/dist/*.zip
          if-no-files-found: error
