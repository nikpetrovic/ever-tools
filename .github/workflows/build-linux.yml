name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: repos/what-ever-mail

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: repos/what-ever-mail/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native addons for Electron
        run: npm run rebuild

      - name: Bundle release notes for Linux
        run: node scripts/bundle-release-notes.mjs linux

      - name: Build and package for Linux
        run: npm run build && electron-builder --linux --x64 && npm run release-notes:cleanup

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatever-mail-linux-appimage
          path: repos/what-ever-mail/dist/*.AppImage
          if-no-files-found: error

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatever-mail-linux-deb
          path: repos/what-ever-mail/dist/*.deb
          if-no-files-found: error
