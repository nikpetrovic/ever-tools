<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DC6E8"/>
      <stop offset="100%" stop-color="#469FE3"/>
    </linearGradient>
  </defs>

  <!-- App icon background: rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Envelope body -->
  <rect x="80" y="152" width="352" height="236" rx="20" ry="20"
        fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="20"/>

  <!-- Envelope flap: V from top-left corner to centre-bottom, back to top-right -->
  <polyline points="80,152 256,288 432,152"
            fill="none" stroke="white" stroke-width="20"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Letter "e" in lower body of envelope -->
  <text
    x="256" y="370"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="108"
    font-weight="800"
    text-anchor="middle"
    fill="white"
    opacity="0.95"
  >e</text>
</svg>
